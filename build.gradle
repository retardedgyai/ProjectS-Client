plugins { id 'base' }

allprojects {
    group = providers.gradleProperty('maven_group').get()
    version = providers.gradleProperty('mod_version').get()
}

tasks.named('check') { dependsOn ':client-core:check', ':editor-core:check', ':devtools:check' }
tasks.named('clean') { dependsOn ':client-core:clean', ':editor-core:clean', ':devtools:clean' }
tasks.named('build') {
    dependsOn ':client-core:build', ':editor-core:build', ':devtools:build'
    doLast {
        if (!project.hasProperty('skipAutoStart')) {
            def core = project(':client-core').layout.buildDirectory.file("libs/projects-client-${project.version}.jar").get().asFile
            def devtools = project(':devtools').layout.buildDirectory.file("libs/projects-devtools-${project.version}.jar").get().asFile
            if (!core.isFile() || !devtools.isFile()) throw new GradleException('Both ProjectS mod artifacts must exist before deployment.')
            def script = layout.projectDirectory.file('scripts/deploy-and-start-client.ps1').asFile.absolutePath
            def process = new ProcessBuilder('powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', script).inheritIO().start()
            if (process.waitFor() != 0) throw new GradleException('Client mod deployment or Launcher restart failed.')
        }
    }
}
