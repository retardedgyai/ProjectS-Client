name: ProjectS Client CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/boss-telegraphs
      - codex/beta-track-h-client-ui-protocol

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Check client
        run: ./gradlew clean check -PskipAutoStart
      - name: Build client without deployment
        run: ./gradlew clean build -PskipAutoStart
